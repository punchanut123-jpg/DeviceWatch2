server {
    listen 80;
    server_name devicewatch.it.npru.ac.th localhost; # เปลี่ยนเป็น Domain จริงของคณะ หรือ IP ของ Server

    # Root directory ของ Frontend static build
    root /var/www/devicewatch/client/dist;
    index index.html;

    # Gzip Compression สำหรับสปีดและประสิทธิภาพ
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 1. Frontend SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching (รูปภาพ, JS, CSS)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 2. Proxy API Requests ไปยัง Node.js Backend (Port 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. Proxy LINE Webhook Request ไปยัง Backend
    location /webhook {
        proxy_pass http://127.0.0.1:3000/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Backend Health Check
    location /health {
        proxy_pass http://127.0.0.1:3000/health;
    }
}
